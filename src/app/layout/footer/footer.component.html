<footer class="footer">
    <div class="container footer-content">
        <div class="footer-logo">
            <h2>Fernando <span>Hernández Lázaro</span></h2>
            <p>{{ t().footer.tagline }}</p>
        </div>
        <div class="footer-social">
            <h4>{{ t().footer.followMe }}</h4>
            <div class="social-links">
                <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer" class="social-icon linkedin" aria-label="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
                <a [href]="profile.github" target="_blank" rel="noopener noreferrer" class="social-icon github" aria-label="GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>
                <a [href]="profile.whatsapp" target="_blank" rel="noopener noreferrer" class="social-icon whatsapp" aria-label="WhatsApp"><i class="fab fa-whatsapp" aria-hidden="true"></i></a>
            </div>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; <span>{{ currentYear }}</span> | <span>{{ t().footer.createdWith }}</span> <i class="fas fa-heart" aria-hidden="true"></i> <span>{{ t().footer.by }}</span> Fernando <span>Hernández Lázaro</span>. <span>{{ t().footer.rights }}</span></p>
    </div>
</footer>
