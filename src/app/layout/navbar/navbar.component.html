<header class="header" [class.scrolled]="isScrolled">
    <nav class="navbar">
        <a href="#home" class="logo">F<span>HL</span></a>

        <button type="button" class="lang-btn" [attr.aria-label]="t().nav.language" (click)="language.toggleLanguage()">
            <i class="fas fa-globe" aria-hidden="true"></i> <span>{{ language.isSpanish() ? 'ES' : 'EN' }}</span>
        </button>

        <ul id="nav-links" class="nav-links" [class.active]="isMenuOpen">
            @for (item of items; track item.section) {
                <li>
                    <a [href]="'#' + item.section" [class.active]="activeSection === item.section"
                       [attr.aria-current]="activeSection === item.section ? 'true' : null" (click)="closeMenu()">{{ t().nav[item.label] }}</a>
                </li>
            }
            <li><a download [href]="cvUrl" class="nav-cv-btn" (click)="closeMenu()"><i class="fas fa-download" aria-hidden="true"></i> CV</a></li>
        </ul>

        <button type="button" class="menu-btn" aria-controls="nav-links" [attr.aria-expanded]="isMenuOpen"
                [attr.aria-label]="isMenuOpen ? t().nav.closeMenu : t().nav.openMenu" (click)="toggleMenu()">
            <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen" aria-hidden="true"></i>
        </button>
    </nav>
</header>
