<section id="home" class="hero">
    <div class="container hero-content">
        <div class="hero-text">
            <p class="greeting">{{ t().hero.greeting }}</p>
            <h1>
                {{ t().hero.iAm }}<span>Fernando</span><br>Hernández Lázaro
            </h1>
            <h3 class="typing-text">{{ t().hero.role }}</h3>
            <p class="description">{{ t().hero.description }}</p>
            <div class="hero-buttons">
                <a href="#contact" class="btn btn-primary">{{ t().hero.contactMe }}</a>
                <a download [href]="cvUrl" class="btn btn-secondary">
                    <i class="fas fa-download" aria-hidden="true"></i> <span>{{ t().common.downloadCv }}</span>
                </a>
            </div>
        </div>
        <div class="hero-image">
            <div class="img-box">
                <div class="image-clipper">
                    <img src="./img/FOTO01.jpg" alt="" fetchpriority="high">
                </div>
            </div>
        </div>
    </div>
    <a href="#about" class="scroll-down" [attr.aria-label]="t().hero.scrollDown">
        <i class="fas fa-chevron-down" aria-hidden="true"></i>
    </a>
</section>
