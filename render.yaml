# Referencia de la configuración del servicio en Render (creado como web service Docker).
# Solo despliega el backend .NET; el frontend sigue en Vercel.
services:
  - type: web
    name: proyecto-practica-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
