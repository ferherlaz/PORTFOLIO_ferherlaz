# Blueprint de Render: solo despliega el backend .NET (el frontend sigue en Vercel).
services:
  - type: web
    name: proyecto-practica-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
